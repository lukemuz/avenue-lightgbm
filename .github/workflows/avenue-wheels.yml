name: Avenue wheels

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'CMakeLists.txt'
      - 'python-package/**'
      - 'include/**'
      - 'src/**'
      - 'external_libs/**'
      - 'tests/avenue_wheel_smoke.py'
      - '.github/workflows/avenue-wheels.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-14
            arch: arm64
          - os: windows-2022
            arch: AMD64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'cibuildwheel==3.4.0' delvewheel
      - run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: avenue-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build lightgbm
      - run: python -m build --sdist
      - name: Install from the source archive, without Git submodules
        run: python -m pip install dist/*.tar.gz
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
      - run: python tests/avenue_wheel_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: avenue-source
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify tag matches package version
        run: |
          python - <<'PYCODE'
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          pattern: avenue-*
          path: dist
          merge-multiple: true
      - name: Create draft release with tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/* > dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --title "Avenue LightGBM $GITHUB_REF_NAME" --generate-notes
